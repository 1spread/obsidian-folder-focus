  <circle cx="160" cy="89" r="8" fill="#28c840"/>
  <text x="640" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#334155">Obsidian - Folder Focus</text>

  <rect x="72" y="116" width="84" height="582" fill="#252833"/>
  <g fill="#cbd5e1">
