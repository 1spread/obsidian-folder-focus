<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Folder Focus preview</title>
  <desc id="desc">A preview of the Folder Focus Obsidian plugin showing a focused folder navigation pane with search, sorting, folder and file rows, multi-selection, and a context menu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="72" y="62" width="1136" height="636" rx="22" fill="#fdfdfd" filter="url(#shadow)"/>

  <rect x="72" y="62" width="1136" height="54" rx="22" fill="#f7f7f8"/>
  <rect x="72" y="94" width="1136" height="22" fill="#f7f7f8"/>
