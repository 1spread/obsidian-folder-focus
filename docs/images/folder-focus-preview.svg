  <g fill="#f59e0b">
    <path d="M546 348h15l4 5h18a5 5 0 0 1 5 5v13a5 5 0 0 1-5 5h-37a5 5 0 0 1-5-5v-18a5 5 0 0 1 5-5z"/>
    <path d="M546 456h15l4 5h18a5 5 0 0 1 5 5v13a5 5 0 0 1-5 5h-37a5 5 0 0 1-5-5v-18a5 5 0 0 1 5-5z"/>
