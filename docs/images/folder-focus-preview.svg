  <rect x="884" y="396" width="236" height="172" rx="12" fill="#ffffff" stroke="#d1d5db" filter="url(#shadow)"/>
  <text x="908" y="430" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#111827">Context menu</text>
  <line x1="908" y1="446" x2="1096" y2="446" stroke="#e5e7eb"/>
  <text x="908" y="476" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#374151">Rename folder</text>
  <text x="908" y="510" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#374151">Delete folder</text>
  <text x="908" y="544" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#374151">Create folder with selection</text>

  <text x="640" y="668" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#475569">Navigate folders, search recursively, multi-select items, and use familiar file actions without leaving the sidebar.</text>
</svg>
