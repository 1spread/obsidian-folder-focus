  <text x="556" y="211" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#64748b">Focused folder navigation in the sidebar</text>

  <rect x="900" y="164" width="114" height="34" rx="8" fill="#ffffff" stroke="#d1d5db"/>
