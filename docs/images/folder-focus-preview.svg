  <text x="188" y="184" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#64748b">/Clients/Projects</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">
