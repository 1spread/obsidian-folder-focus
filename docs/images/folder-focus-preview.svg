    <rect x="102" y="250" width="24" height="24" rx="5" opacity="0.7"/>
    <rect x="102" y="298" width="24" height="24" rx="5" opacity="0.7"/>
  </g>
  <rect x="92" y="144" width="44" height="44" rx="12" fill="#3b82f6" opacity="0.22"/>

  <rect x="156" y="116" width="338" height="582" fill="#fafafa"/>
